<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - OneSpace ERP Systems v16</title>
  <link rel="icon" type="image/svg+xml" href="../onespace/public/images/favicon.svg">
  <link rel="stylesheet" href="../onespace/public/css/tokens.css">
  <link rel="stylesheet" href="../onespace/public/css/login.css">
</head>
<body class="onespace-login-body">
  <div class="onespace-ambient-orb-primary"></div>
  <div class="onespace-ambient-orb-secondary"></div>

  <!-- Header -->
  <header class="onespace-login-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="#" style="display: flex; align-items: center;">
        <img src="../onespace/public/images/onespace_light.png" alt="OneSpace" class="onespace-brand-logo onespace-logo-light" style="height: 28px;">
        <img src="../onespace/public/images/onespace_dark.png" alt="OneSpace" class="onespace-brand-logo onespace-logo-dark" style="height: 28px; display: none;">
      </a>
      <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--os-brand-primary-tint); color: var(--os-brand-primary);">
        v16 Enterprise
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="onespace-cluster-pill">
        <span class="onespace-pulse-dot"></span>
        <span>Cluster: East-01 (Active)</span>
      </div>

      <!-- Theme Switcher -->
      <button id="theme-toggle-btn" type="button" aria-label="Toggle Theme" style="background: var(--os-surface); border: 1px solid var(--os-border); border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--os-text); font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 6px;">
        <span id="theme-label">Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- Login Card -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="onespace-login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px; background: var(--os-brand-primary-tint); display: flex; align-items: center; justify-content: center;">
          <img src="../onespace/public/images/onespace_icon.svg" alt="OneSpace" width="36" height="36">
        </div>
        <h1 style="font-family: var(--os-font-display); font-size: 24px; font-weight: 700; margin: 0 0 6px 0; color: var(--os-text);">
          Sign in to OneSpace
        </h1>
        <p style="font-size: 13px; color: var(--os-text-muted); margin: 0;">
          Welcome! Enter your credentials to access your ERP workspace.
        </p>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='desktop_app_launcher.html';">
        <div>
          <label class="onespace-form-label" for="login_email">Email or Username</label>
          <div class="onespace-input-wrapper">
            <span class="onespace-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </span>
            <input type="text" id="login_email" class="onespace-login-input" placeholder="admin@onespace.sh" value="admin@onespace.sh" required autofocus>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label class="onespace-form-label" for="login_password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 12px; color: var(--os-brand-primary); text-decoration: none; font-weight: 600;">
              Forgot password?
            </a>
          </div>
          <div class="onespace-input-wrapper">
            <span class="onespace-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="login_password" class="onespace-login-input" placeholder="••••••••" value="password123" required>
            <button type="button" class="onespace-eye-toggle" id="toggle-password-btn" aria-label="Toggle Password Visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--os-text-muted); cursor: pointer;">
            <input type="checkbox" id="remember_me" checked style="accent-color: var(--os-brand-primary); width: 16px; height: 16px;">
            <span>Keep me signed in for 30 days</span>
          </label>
        </div>

        <button type="submit" class="onespace-btn-submit">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </form>
    </div>
  </main>

  <footer style="padding: 16px; text-align: center; font-size: 12px; color: var(--os-text-muted);">
    <span>&copy; 2026 OneSpace ERP Systems. All rights reserved.</span>
    <span style="margin: 0 8px;">•</span>
    <a href="../onespace/templates/pages/open_source_notices.html" style="color: var(--os-text-muted); text-decoration: underline;">Open Source Notices</a>
  </footer>

  <script src="../onespace/public/js/theme_switcher.js"></script>
  <script>
    document.getElementById('toggle-password-btn').addEventListener('click', function() {
      const p = document.getElementById('login_password');
      p.type = p.type === 'password' ? 'text' : 'password';
    });

    const toggleBtn = document.getElementById('theme-toggle-btn');
    const themeLabel = document.getElementById('theme-label');
    function sync(theme) {
      themeLabel.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
      document.querySelector('.onespace-logo-light').style.display = theme === 'dark' ? 'none' : 'block';
      document.querySelector('.onespace-logo-dark').style.display = theme === 'dark' ? 'block' : 'none';
    }
    toggleBtn.addEventListener('click', () => { OneSpace.toggleTheme(); sync(OneSpace.getTheme()); });
    sync(OneSpace.getTheme());
  </script>
</body>
</html>
