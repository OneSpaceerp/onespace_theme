[project]
name = "onespace"
authors = [
    { name = "OneSpace ERP Systems", email = "kelshiekh@gmail.com" }
]
description = "OneSpace — the whitelabel brand and design layer for Frappe 16 and ERPNext 16."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]

# frappe and erpnext are installed and managed by bench, never by pip.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "onespace"

# Bounded on both sides: bench and Frappe Cloud refuse an open range.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191", "E101", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
